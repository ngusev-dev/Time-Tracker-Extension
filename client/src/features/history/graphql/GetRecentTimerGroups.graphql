query GetRecentTimerGroups($limit: Int!) {
  getRecentTimerGroups(limit: $limit) {
    groupField
    records {
      id
      startTimer
      endTimer
      totalTimeInSeconds
      userId
      description
      timerId
      taskTypeId
      user {
        id
        firstName
        lastName
        middleName
      }
    }
  }
}
